<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>正在启动 · 研究资产库</title>
    <style>
      :root { color-scheme: light; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; color: #18231f; background: #f6f4ed; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 28px 18px; }
      .card { width: min(100%, 520px); padding: clamp(24px, 5vw, 36px); background: #fffdf8; border: 1px solid #deded4; border-radius: 20px; box-shadow: 0 18px 48px rgba(24, 35, 31, .07); }
      .eyebrow { margin: 0 0 12px; color: #285f50; font-size: 12px; font-weight: 700; letter-spacing: .08em; }
      h1 { margin: 0; font-size: clamp(23px, 5vw, 28px); line-height: 1.3; }
      .sub { margin: 8px 0 28px; color: #5f6b65; font-size: 14px; line-height: 1.6; }
      .progress-heading { display: flex; justify-content: space-between; gap: 16px; align-items: baseline; }
      .progress-heading strong { font-size: 14px; }
      .progress-heading span { color: #5f6b65; font-size: 13px; white-space: nowrap; }
      .bar { height: 8px; margin: 12px 0 25px; overflow: hidden; border-radius: 99px; background: #dfeae4; }
      .bar > div { width: 0; height: 100%; background: #285f50; transition: width .2s ease; }
      ol { list-style: none; margin: 0; padding: 0; }
      li { display: flex; align-items: center; gap: 13px; min-height: 48px; border-top: 1px solid #f0eee5; }
      .marker { display: grid; place-items: center; flex: 0 0 24px; height: 24px; border-radius: 50%; background: #f0eee5; color: #65706b; font-size: 12px; font-weight: 700; }
      li[data-state="pending"] .marker { background: #dfeae4; color: #285f50; }
      li[data-state="done"] .marker { background: #285f50; color: white; }
      li[data-state="failed"] .marker { background: #f7e4e2; color: #a33d3d; }
      .step-name { flex: 1; min-width: 0; font-size: 14px; }
      .step-state { color: #65706b; font-size: 12px; white-space: nowrap; }
      li[data-state="pending"] .step-state, li[data-state="done"] .step-state { color: #285f50; }
      li[data-state="failed"] .step-state { color: #a33d3d; }
      .error { margin-top: 22px; padding: 16px; border: 1px solid #ebc9c6; border-radius: 12px; background: #fff4f2; color: #782e2e; }
      .error[hidden] { display: none; }
      .error strong { display: block; margin-bottom: 7px; font-size: 14px; }
      .error-detail { margin: 0; font-size: 13px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
      .error-hint { margin: 12px 0 0; font-size: 12px; line-height: 1.6; }
      @media (prefers-reduced-motion: reduce) { .bar > div { transition: none; } }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">RESEARCH ASSET HUB</p>
      <h1>研究资产库</h1>
      <p class="sub" id="summary" role="status" aria-live="polite">正在准备本地服务，请稍候。</p>
      <div class="progress-heading"><strong>启动进度</strong><span id="progress-count">已完成 0 / 5 项</span></div>
      <div class="bar" id="progress" role="progressbar" aria-label="启动进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="bar"></div></div>
      <ol id="steps" aria-label="启动阶段">
        <li data-step="预检环境" data-state="waiting"><span class="marker" aria-hidden="true">1</span><span class="step-name">预检环境</span><span class="step-state">等待中</span></li>
        <li data-step="启动数据库" data-state="waiting"><span class="marker" aria-hidden="true">2</span><span class="step-name">启动数据库</span><span class="step-state">等待中</span></li>
        <li data-step="启动搜索引擎" data-state="waiting"><span class="marker" aria-hidden="true">3</span><span class="step-name">启动搜索引擎</span><span class="step-state">等待中</span></li>
        <li data-step="数据迁移" data-state="waiting"><span class="marker" aria-hidden="true">4</span><span class="step-name">数据迁移</span><span class="step-state">等待中</span></li>
        <li data-step="启动应用服务" data-state="waiting"><span class="marker" aria-hidden="true">5</span><span class="step-name">启动应用服务</span><span class="step-state">等待中</span></li>
      </ol>
      <section class="error" id="error" role="alert" hidden>
        <strong>启动失败</strong>
        <p class="error-detail" id="error-detail"></p>
        <p class="error-hint">可在系统托盘菜单选择“重试启动”。</p>
      </section>
    </main>
    <script>
      const rows = Array.from(document.querySelectorAll("#steps li"));
      const labels = { waiting: "等待中", pending: "进行中", done: "已完成", failed: "失败" };
      const summary = document.getElementById("summary");
      const progress = document.getElementById("progress");
      const bar = document.getElementById("bar");
      const count = document.getElementById("progress-count");
      const error = document.getElementById("error");
      const errorDetail = document.getElementById("error-detail");

      window.__hubProgress = function (payload) {
        const row = rows.find((item) => item.dataset.step === payload.step);
        if (!row || !["pending", "done", "failed"].includes(payload.status)) return;

        // 每次重试都由预检 pending 开始。此前完成的阶段和错误不属于本次启动。
        if (payload.step === "预检环境" && payload.status === "pending") {
          for (const item of rows) {
            item.dataset.state = "waiting";
            item.querySelector(".step-state").textContent = labels.waiting;
          }
          error.hidden = true;
          errorDetail.textContent = "";
        }

        row.dataset.state = payload.status;
        row.querySelector(".step-state").textContent = labels[payload.status];

        const completed = rows.filter((item) => item.dataset.state === "done").length;
        const percent = Math.round(completed / rows.length * 100);
        progress.setAttribute("aria-valuenow", String(percent));
        bar.style.width = percent + "%";
        count.textContent = `已完成 ${completed} / ${rows.length} 项`;

        if (payload.status === "failed") {
          summary.textContent = `${payload.step}失败，请查看下方详情。`;
          errorDetail.textContent = payload.detail || "启动失败，未收到详细原因。";
          error.hidden = false;
        } else if (completed === rows.length) {
          summary.textContent = "所有启动阶段已完成，正在打开主界面。";
          error.hidden = true;
        } else if (payload.status === "pending") {
          summary.textContent = `正在${payload.step}…`;
          error.hidden = true;
        } else {
          summary.textContent = `${payload.step}已完成。`;
          error.hidden = true;
        }
      };

      // 壳在页面脚本初始化前可能已经发出首个事件。
      window.__hubProgress({ step: "预检环境", status: "pending" });
    </script>
  </body>
</html>
