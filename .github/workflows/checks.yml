name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/check_repository.py
  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen ruff check apps packages scripts tests
      - run: uv run --frozen python -m pytest -q -rs
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @research-asset-hub/web typecheck
      - run: pnpm --filter @research-asset-hub/web test
      - run: pnpm --filter @research-asset-hub/web build
  desktop:
    runs-on: windows-latest
    env:
      TAURI_CONFIG: '{"bundle":{"resources":null}}'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: ${{ runner.os }}-desktop-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-desktop-
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @research-asset-hub/web build
      - run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --check
      - run: cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml --lib
