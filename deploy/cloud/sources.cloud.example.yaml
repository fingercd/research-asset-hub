schema_version: 1
workspace_root: /srv/research-assets

# The cloud gateway still sees the same stable source IDs and relative layouts.
# Mount a private snapshot beneath /srv/research-assets and keep it read-only.
sources:
  - id: agent
    label: Agent 学习
    domain: agent
    adapter: agent
    root: agent
    manifest: metadata/site-data.json
    read_only: true
    asset_roots:
      pdf: papers
      repository: code/original
      annotation: code/annotated
      html: site

  - id: infra
    label: AI / 大模型 Infra
    domain: infra
    adapter: infra
    root: infra
    manifest: manifest.json
    read_only: true
    asset_roots:
      pdf: pdfs
      repository: code/repos
      annotation: code/papers
      html: .

  - id: world_model
    label: 世界模型
    domain: world-model
    adapter: world_model
    root: world_model
    manifest: library/catalog/papers.json
    read_only: true
    asset_roots:
      pdf: library/papers
      repository: library/code/upstream
      annotation: library/code/annotated
      html: library/site

  - id: reinforcement_learning
    label: 强化学习
    domain: reinforcement-learning
    adapter: reinforcement_learning
    root: reinforcement_learning
    manifest: data/papers.json
    read_only: true
    asset_roots:
      pdf: papers
      repository: code/repos
      annotation: code/annotations
      html: .

  - id: fine_tuning
    label: 大模型微调
    domain: fine-tuning
    adapter: fine_tuning
    root: fine_tuning
    manifest: manifest.json
    read_only: true
    asset_roots:
      pdf: papers
      repository: code
      annotation: code
      html: site

  - id: generation
    label: 图像与视频生成
    domain: generation
    adapter: generation
    root: generation
    manifest: data/manifest.json
    read_only: true
    asset_roots:
      pdf: papers
      repository: code
      annotation: code
      html: site

  - id: llm_tech_reports
    label: 大语言模型与大厂技术报告
    domain: llm-tech-reports
    adapter: generic_manifest
    root: llm_tech_reports
    manifest: data/manifest.json
    read_only: true
    asset_roots:
      pdf: pdfs
      repository: code/repos
      html: .

plugin_discovery:
  entry_point_group: research_asset_hub.adapters
  allow_module_imports: false
  generic_adapter_kind: generic_manifest

defaults:
  read_only: true
  access_level: private
  locale: zh-CN
  strong_digest: sha256
