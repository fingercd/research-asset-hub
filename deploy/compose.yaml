name: research-asset-hub

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: research_asset_hub
      POSTGRES_USER: research_hub
      POSTGRES_PASSWORD: ${HUB_POSTGRES_PASSWORD:-research_hub_local}
    ports:
      - "127.0.0.1:${HUB_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research_hub -d research_asset_hub"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.12
    environment:
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${HUB_MEILISEARCH_API_KEY:-research-hub-local-meili-key}
    ports:
      - "127.0.0.1:${HUB_MEILISEARCH_PORT:-7700}:7700"
    volumes:
      - meilisearch-data:/meili_data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - --header='Authorization: Bearer ${HUB_MEILISEARCH_API_KEY:-research-hub-local-meili-key}' http://127.0.0.1:7700/health | grep -q available",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.13.6
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "127.0.0.1:${HUB_QDRANT_HTTP_PORT:-6333}:6333"
      - "127.0.0.1:${HUB_QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
  meilisearch-data:
  qdrant-data:
